<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shadows and Outline</title>

    <style>
      .box {
        border: 2px solid black;
        width: 40vw;
        /* box-shadow: inset 5px 5px 2px 1px red;*/
        box-shadow:  5px 5px 2px 1px red;
        text-shadow: 5px 4px 1px red;

        outline: 2px solid green;
        outline-offset: 5px;
      }
    </style>
  </head>
  <body>
    <div class="box">I am the box</div>
  </body>
</html>
