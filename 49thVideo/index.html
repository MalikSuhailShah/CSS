<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Fit And Object Cover</title>
    <style>
        .container{
             width: 500px;
            height: 400px;
            background-color: aqua;
            border: 2px solid black;
        }

        img
        {
            width: 500px;
            height: 400px;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://images.unsplash.com/photo-1530982011887-3cc11cc85693?q=80&w=1332&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" >
    </div>
    
</body>
</html>
