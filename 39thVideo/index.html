<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid In CSS</title>

    <style>
        .container{
            border: 2px solid yellow;
            display: grid;
            grid-template-columns: [firstCL] 130px [secondCL] 100px [thirdCL] ;
            grid-template-rows: [firstRL] 100px [secondRL]100px [thirdRL]100px;

        }
        .item{
            height: 60px;
            width: 60px;
            border: 2px solid red;

        }
        .item4{
            grid-column: 1/2;
            grid-row: 1/2;
        }

        .item1{
            grid-column:1/2;
            grid-row:1/2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item item1">1</div>
        <div class="item item2">2</div>
        <div class="item item3">3</div>
        <div class="item item4">4</div>
        <div class="item item5">5</div>
    </div>
</body>
</html>
