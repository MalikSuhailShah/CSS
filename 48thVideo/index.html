<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0 " />

    <title>Ball Bounce Animation</title>

    <style>
      * {
        margin: 0;
        padding: 0;
      }

      .container {
        width: 80vw;
        height: 60vh;
        background-color: blue;
        border: 2px solid blanchedalmond;

        position: relative;
      }

      .ball {
        width: 50px;
        height: 50px;
        background-color: red;
        border-radius: 50px;

        position: absolute;
        bottom: 0px;
        left: 0px;

        animation: animateX 3s linear infinite, animateY 1s ease-out infinite alternate ;
      }

      @keyframes animateX {
        from {
          left: 0%;
        }
        to {
          left: 90%;
        }
      }

      @keyframes animateY {
        from {
          bottom: 0%;
        }
        to {
          bottom: 80%;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="ball"></div>
    </div>
  </body>
</html>
