<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        padding: 0;
        margin: 0;
      }
      .box {
        border: 2px solid black;
        width: 60vw;
        height: 450px;
        margin: 10px;
        padding: 5px;
      }
      .box1 {
        background-color: azure;
        z-index: 1;
        position: sticky;
            top:0px;
            height: 111px;
            width:100%;
            margin: 0;
            padding: 0;
      }
      .box2 {
        background-color:
     rgb(153, 153, 45);
     z-index: 2;
        position: relative;
        /* top: 25px; */
      }
      .box3 {
        background-color: aquamarine;
        position: fixed;

        bottom: 0px;
        left: 8vw;
        height: 111px;
      }
      .box4 {
        background-color: cornflowerblue;
        /* position: absolute; */
        /* this positioned the element relative to the nearest positioned ancestor */
        top: 0px;
        left: 3px;
      }
      .box5 {
        background-color:blueviolet ;
      }

      .parent {
        border: 2px solid black;

        margin: 23px;
        padding: 30px;
        position: relative;
      }
    </style>
    <title>Position Property</title>
  </head>
  <body>
    <div class="parent">
      <div class="box box1"></div>
      <div class="box box2"></div>
      <div class="box box3"></div>
      <div class="box box4"></div>
      <div class="box box5"></div>
    </div>
  </body>
</html>
