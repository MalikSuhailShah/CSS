<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        * {
            margin:0;
            padding:0;
        }
        .box{
            display:inline-block;
            border:2px solid red;
            padding:23px;
            margin:23px;
            width:233px;
        }

        .box1{
             display:none;  /*space and box will disappear */
            /* visibility: hidden; space remain but box will disappear */
        }

    </style>
    <title>Display Property</title>
  </head>
  <body>
    <div class="box box1">I am a box..</div>
    <div class="box">And a nice one</div>
    <span> I am good in Physics..</span>
    <span> and in maths alsoo....

    </span>
  </body>
</html>
